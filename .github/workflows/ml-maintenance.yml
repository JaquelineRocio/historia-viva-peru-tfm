name: ML maintenance

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'tfidf: CPU baseline; beto: requires a configured GPU runner'
        type: choice
        options: [tfidf, beto]
        default: tfidf
  push:
    branches: [main]
    paths:
      - 'artifacts/datasets/**'
      - 'configs/experiments/**'
      - 'apps/ml/app/ml/experiment*.py'
      - 'apps/ml/app/ml/beto_experiment.py'
      - 'apps/ml/app/ml/maintenance.py'
      - '.github/workflows/ml-maintenance.yml'
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ml-maintenance
  cancel-in-progress: false

jobs:
  experiment:
    # Un runner propio solo procesa la rama principal, nunca pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (inputs.backend == 'beto' || (github.event_name != 'workflow_dispatch' && vars.ML_BACKEND == 'beto')) && fromJSON('["self-hosted", "ml-gpu"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 180
    env:
      PYTHONPATH: apps/ml
      BACKEND: ${{ inputs.backend || vars.ML_BACKEND || 'tfidf' }}
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      REFERENCE_SNAPSHOT: ${{ vars.ML_REFERENCE_SNAPSHOT || 'artifacts/datasets/gold-v1-source-aware.json' }}
      REVIEWED_SNAPSHOT: ${{ vars.ML_REVIEWED_SNAPSHOT }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: |
          python -m pip install -r apps/ml/requirements-test.txt -r apps/ml/requirements-experiments.txt
          if [ "$BACKEND" = beto ]; then
            python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu126
          fi
      - name: Verify pipeline controls
        run: python -m pytest apps/ml/tests/test_experiments.py -q
      - name: Train, select, evaluate and register candidate
        run: |
          case "$BACKEND" in tfidf|beto) ;; *) exit 1 ;; esac
          if [ -n "$REVIEWED_SNAPSHOT" ]; then
            python -m app.ml.maintenance --reference "$REFERENCE_SNAPSHOT" --reviewed "$REVIEWED_SNAPSHOT" --config "configs/experiments/$BACKEND.json" --output outputs/maintenance
          else
            python -m app.ml.experiments --dataset "$REFERENCE_SNAPSHOT" --config "configs/experiments/$BACKEND.json" --output outputs/maintenance
          fi
      - name: Write execution summary
        if: success()
        run: cat outputs/maintenance/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ml-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/maintenance/**/*.json
            outputs/maintenance/report.md
          retention-days: 90
      - name: Archive selected candidate weights
        if: success()
        # Solo se copia el ganador; los informes conservan todos los experimentos.
        run: |
          python -c "import json,pathlib,shutil; p=pathlib.Path('outputs/maintenance'); r=json.loads((p/'report.json').read_text(encoding='utf-8')); shutil.copytree(p/r['selected'], 'outputs/candidate') if r.get('selected') else print('No new candidate: training skipped')"
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ml-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/candidate/
          if-no-files-found: ignore
          retention-days: 30
