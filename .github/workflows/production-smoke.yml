name: Production smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1
      - name: Verify production
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME || 'docente' }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'tfm2026' }}
          API_URL: ${{ vars.API_URL || 'https://historia-viva-api.onrender.com' }}
          WEB_URL: ${{ vars.WEB_URL || 'https://historia-viva-peru-tfm-web.vercel.app' }}
        run: python scripts/smoke_deployment.py --api-url "$API_URL" --web-url "$WEB_URL" --output outputs/production-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-${{ github.run_id }}
          path: outputs/production-smoke.json
