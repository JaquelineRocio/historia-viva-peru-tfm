name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --include=optional
      - run: npm run lint
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q --junitxml=../../outputs/ci/ml-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-test-results
          path: outputs/ci/ml-tests.xml

  quality-gate:
    name: Quality gate
    needs: [api, web, ml]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ML_RESULT: ${{ needs.ml.result }}
        run: |
          test "$API_RESULT" = success
          test "$WEB_RESULT" = success
          test "$ML_RESULT" = success
